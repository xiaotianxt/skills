<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Helium Agent Browser Regression Fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 32px; max-width: 760px; }
      label { display: block; margin: 12px 0; }
      input, textarea, select, button { font: inherit; padding: 6px 8px; }
      #status { margin-top: 16px; padding: 10px; border: 1px solid #999; }
      iframe { width: 100%; height: 150px; border: 1px solid #999; margin-top: 16px; }
    </style>
  </head>
  <body>
    <h1>Helium Agent Browser Regression Fixture</h1>
    <form id="profile">
      <label>Name <input id="name" name="name" autocomplete="off"></label>
      <label>Email <input id="email" name="email" type="email" autocomplete="off"></label>
      <label>Role
        <select id="role" name="role">
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="staff">Staff</option>
        </select>
      </label>
      <label><input id="agree" type="checkbox"> I agree</label>
      <label>Notes <textarea id="notes" name="notes"></textarea></label>
      <button id="save" type="button">Save profile</button>
      <button id="add" type="button">Add item</button>
    </form>
    <div id="status">idle</div>
    <ul id="items"></ul>
    <iframe
      id="child"
      title="child-form"
      srcdoc="<!doctype html><html><body><label>Child code <input id='child-code'></label><button id='child-send' type='button'>Send child code</button><script>document.getElementById('child-send').addEventListener('click', function () { parent.postMessage({ childCode: document.getElementById('child-code').value }, '*'); });</script></body></html>">
    </iframe>
    <script>
      let childCode = "";
      let count = 0;
      window.addEventListener("message", function (event) {
        if (event.data && event.data.childCode) childCode = event.data.childCode;
      });
      document.getElementById("add").addEventListener("click", function () {
        count += 1;
        const item = document.createElement("li");
        item.textContent = "item-" + count;
        document.getElementById("items").appendChild(item);
      });
      document.getElementById("save").addEventListener("click", function () {
        const data = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          role: document.getElementById("role").value,
          agree: document.getElementById("agree").checked,
          notes: document.getElementById("notes").value,
          childCode: childCode,
          itemCount: document.querySelectorAll("#items li").length
        };
        localStorage.setItem("heliumBgProfile", JSON.stringify(data));
        document.getElementById("status").textContent =
          "saved:" + data.name + ":" + data.role + ":" + data.agree + ":" + data.childCode + ":" + data.itemCount;
      });
    </script>
  </body>
</html>
